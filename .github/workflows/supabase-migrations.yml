name: Supabase migrations

# develop -> proyecto "Pontem Web - Canary" (canary.pontemcc.cl)
# main    -> proyecto "Pontem Web - Prod"   (www.pontemcc.cl)
on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_REF: equfcqojbefvynuppxoq
      CANARY_REF: gwlfogchwhaimsxjvikj
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target project
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ref=$PROD_REF"          >> "$GITHUB_OUTPUT"
            echo "name=Pontem Web - Prod" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$CANARY_REF"          >> "$GITHUB_OUTPUT"
            echo "name=Pontem Web - Canary" >> "$GITHUB_OUTPUT"
          fi

      - name: Push migrations to ${{ steps.target.outputs.name }}
        env:
          SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_CANARY }}
          PROJECT_REF: ${{ steps.target.outputs.ref }}
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Falta el secret con la password de la base de datos"; exit 1; }
          supabase link --project-ref "$PROJECT_REF"
          supabase migration list --linked
          supabase db push
