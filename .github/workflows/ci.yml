name: CI

# Tipos y lint en cada PR y en cada push a develop/main. Las reglas de estilos
# (docs/estilos.md) viven en eslint.config.mjs.
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec nuxt typecheck

      - name: Lint
        run: pnpm exec eslint .
