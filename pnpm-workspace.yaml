# Dependencias autorizadas a correr sus scripts de instalación.
# `supabase` es la crítica: su postinstall descarga el binario de la CLI, y sin él
# fallan `pnpm supabase start` / `db reset`.
#
# Se declaran las dos claves a propósito: pnpm 11 renombró `onlyBuiltDependencies`
# a `allowBuilds` e ignora la vieja, mientras que pnpm 10 ignora la nueva.
# Manteniendo ambas, el proyecto instala igual en las dos versiones.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
  vue-demi: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
  - supabase
  - unrs-resolver
  - vue-demi

# defu 6.1.6 (dependencia de Nuxt) publica tipos rotos: `Defu` no se resuelve como
# tipo y el AppConfig generado por Nuxt queda en `unknown`, así que las variantes
# propias del tema (app/theme) no aparecen en los tipos de los componentes.
# 6.1.7 corrige la entrada de tipos y conserva el arreglo de seguridad de 6.1.5.
overrides:
  defu: ^6.1.7
